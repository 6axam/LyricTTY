[package]
name = "lyrictty"
version = "0.1.0"
edition = "2021"
description = "Synced lyrics and adaptive music UI for your terminal"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
zbus = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
unicode-segmentation = "1"
unicode-width = "0.2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
